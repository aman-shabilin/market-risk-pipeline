services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      MR_DATABASE_URL: "sqlite:///./market_risk.db"
      MR_USE_LOCAL_SOURCE: "true"
      MR_LOCAL_DATA_PATH: "./data/sample"
      MR_REDIS_URL: "redis://redis:6379/0"
      MR_CACHE_TTL_SECONDS: "300"
    depends_on:
      - redis
    volumes:
      - ./data:/app/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
