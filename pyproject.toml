[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-risk-pipeline"
version = "0.1.0"
description = "Ingest market data from S3, compute risk metrics, serve via FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "boto3>=1.34",
    "redis>=5.0",
    "scipy>=1.12",
    "yfinance>=0.2.40",
]

[project.scripts]
market-risk-ingest = "market_risk.pipeline.orchestrator:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "moto[s3]>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "boto3.*",
    "botocore.*",
    "yfinance.*",
    "scipy.*",
    "redis.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["market_risk"]

[tool.coverage.report]
fail_under = 80
show_missing = true
